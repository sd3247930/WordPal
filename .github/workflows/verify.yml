name: WordPal verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: powershell -ExecutionPolicy Bypass -File tools/preflight-scan.ps1
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:h5
        env:
          WORDPAL_BASE_PATH: /WordPal/
          VITE_WORDPAL_LOCAL_CONTENT: '0'
      - run: npx playwright install chromium
      - run: npm run test:production
      - run: npm run build:app
      - run: npm run check:compiler
      - run: npm run build:mp-weixin
      - run: npm run check:release
  ui:
    needs: verify
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      WORDPAL_VISUAL_PROFILE: windows-server
      VITE_WORDPAL_LOCAL_CONTENT: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:ui -- --shard=${{ matrix.shard }}/3 --update-snapshots=none
