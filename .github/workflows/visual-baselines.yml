name: Render synthetic visual baselines
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    if: github.repository == 'sd3247930/WordPal'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Render formal baselines with synthetic profiles
        run: npx playwright test tests/ui/golden.spec.ts tests/ui/pet-house.spec.ts tests/ui/pet-lifehouse-visual.spec.ts tests/ui/study-wordbook.spec.ts tests/ui/v2-matrix.spec.ts --update-snapshots=all --workers=3
        env:
          WORDPAL_VISUAL_PROFILE: windows-server
          VITE_WORDPAL_LOCAL_CONTENT: '0'
      - run: powershell -ExecutionPolicy Bypass -File tools/preflight-scan.ps1
      - name: Export formal baseline images for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-windows-server-baselines
          path: tests/ui/__screenshots__/windows-server/*.png
          if-no-files-found: error
          retention-days: 1
