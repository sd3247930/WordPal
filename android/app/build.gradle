plugins { id 'com.android.application' }
def version = new Properties()
file('../wordpal-version.properties').withInputStream { version.load(it) }
def appKey = System.getenv('WORDPAL_DCLOUD_APPKEY') ?: 'WORDPAL_APPKEY_PENDING'
android {
    namespace 'com.wordpal.offline'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'com.wordpal.app'
        minSdk 23
        targetSdk 35
        versionCode version.code.toInteger()
        versionName version.name
        multiDexEnabled true
        manifestPlaceholders = [wordpalAppKey: appKey]
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    signingConfigs {
        release {
            if (System.getenv('WORDPAL_SIGN_STORE_FILE')) {
                storeFile file(System.getenv('WORDPAL_SIGN_STORE_FILE'))
                storePassword System.getenv('WORDPAL_SIGN_STORE_PASSWORD')
                keyAlias System.getenv('WORDPAL_SIGN_ALIAS')
                keyPassword System.getenv('WORDPAL_SIGN_KEY_PASSWORD')
            }
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }
    packaging { jniLibs { useLegacyPackaging true } }
    androidResources {
        additionalParameters '--auto-add-overlay'
        ignoreAssetsPattern '!.svn:!.git:.*:!CVS:!thumbs.db:!picasa.ini:!*.scc:*~'
    }
}
tasks.register('validateReleaseIdentity') {
    doLast {
        def required = ['WORDPAL_DCLOUD_APPKEY', 'WORDPAL_SIGN_STORE_FILE', 'WORDPAL_SIGN_ALIAS', 'WORDPAL_SIGN_STORE_PASSWORD', 'WORDPAL_SIGN_KEY_PASSWORD']
        if (required.any { !System.getenv(it)?.trim() }) throw new GradleException('Release signing configuration is incomplete; debug fallback is disabled.')
        if (!(appKey ==~ /[a-fA-F0-9]{32}/)) throw new GradleException('DCloud AppKey format is invalid.')
    }
}
tasks.configureEach { if (name in ['packageRelease', 'assembleRelease']) dependsOn tasks.named('validateReleaseIdentity') }
dependencies {
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'])
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.0.0'
    implementation 'androidx.core:core:1.6.0'
    implementation 'androidx.fragment:fragment:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    implementation 'com.facebook.fresco:fresco:3.4.0'
    implementation 'com.facebook.fresco:middleware:3.4.0'
    implementation 'com.facebook.fresco:animated-gif:3.4.0'
    implementation 'com.facebook.fresco:webpsupport:3.4.0'
    implementation 'com.facebook.fresco:animated-webp:3.4.0'
    implementation 'com.github.bumptech.glide:glide:4.9.0'
    implementation 'com.alibaba:fastjson:1.2.83'
    implementation 'androidx.webkit:webkit:1.5.0'
    implementation 'net.lingala.zip4j:zip4j:2.11.5'
}
